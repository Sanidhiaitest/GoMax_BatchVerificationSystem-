project_id = "gomax-batch-verification"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5174"]
jwt_expiry = 3600
enable_signup = false
# Anonymous auth is required: the supervisor PWA signs devices in
# anonymously (no email/password) and identifies the human via PIN
# (see login_supervisor_pin RPC), not via Supabase Auth credentials.
enable_anonymous_sign_ins = true

[functions.flag-batch]
verify_jwt = false
